# =============================================================================
# 基于 GIS 与多目标优化的 eVTOL 起降场选址研究 —— 成都市案例 主配置
# Chengdu eVTOL Vertiport Siting — master configuration
# =============================================================================
# 所有可调参数集中在此。论文中的敏感性分析章节通过覆盖此文件实现。
# 单位约定：长度=米(m)，时间=秒(s)，货币=人民币元(CNY)，人口=人。
# -----------------------------------------------------------------------------

project:
  name: "Chengdu eVTOL Vertiport Siting"
  case_city: "Chengdu, Sichuan, China"
  random_seed: 42          # 全局随机种子，保证结果可复现（论文要求）

# -----------------------------------------------------------------------------
# 坐标系
# -----------------------------------------------------------------------------
crs:
  geographic: "EPSG:4326"   # WGS84 经纬度，用于数据下载与交换
  projected:  "EPSG:32648"  # WGS84 / UTM zone 48N，用于所有距离/面积计算
                            # 成都经度约 104.06°E，落在 UTM 48N (102°E–108°E)

# -----------------------------------------------------------------------------
# 研究区：成都市绕城高速以内 + 天府新区核心区
# -----------------------------------------------------------------------------
study_area:
  # 下载用的外包矩形 (WGS84: minx, miny, maxx, maxy)
  # 已收紧到研究区多边形的外接矩形 + 少量余量：Overpass 强限流下，
  # 每多一个瓦片就要多等约 11 秒；外围那些最终会被多边形裁掉的瓦片
  # 纯属浪费。0.30° × 0.38° 约 285 个瓦片。
  bbox: [103.920, 30.400, 104.220, 30.780]

  # 研究区边界。有两种模式：
  #   polygon  —— 使用下方 polygon 顶点（默认，绕城高速环线 + 天府新区核心区近似）
  #   file     —— 读取本地矢量文件（若有官方边界，推荐替换）
  boundary_mode: "polygon"
  boundary_file: null       # 例如 "data/raw/boundary/chengdu_study_area.geojson"

  # 绕城高速(G4201)环线 + 天府新区核心区 的多边形顶点 (lon, lat)
  # 说明：这是基于 G4201 环线的近似多边形，正式投稿前建议替换为
  #       OSM relation 或成都市规划部门官方边界（见 scripts/01_fetch_data.py）
  polygon:
    - [103.945, 30.723]
    - [104.020, 30.760]
    - [104.105, 30.755]
    - [104.170, 30.720]
    - [104.195, 30.665]
    - [104.190, 30.610]
    - [104.165, 30.575]
    - [104.150, 30.520]
    - [104.135, 30.465]
    - [104.090, 30.425]
    - [104.030, 30.440]
    - [104.005, 30.495]
    - [103.990, 30.560]
    - [103.960, 30.620]
    - [103.935, 30.670]

# -----------------------------------------------------------------------------
# 阶段一：候选起降场筛选 (GIS)
# -----------------------------------------------------------------------------
stage1_candidates:
  grid_size_m: 500.0        # 空间栅格化单元边长（需求聚合单元）

  rooftop:
    enabled: true
    min_height_m: 20.0      # 建筑高度阈值 h >= 20 m
    min_roof_area_m2: 1600.0  # 屋顶可用面积阈值 A >= 1600 m² (≈40m×40m)
    # 屋顶实际可用率：扣除电梯井/设备层/女儿墙等占用
    usable_roof_ratio: 0.70
    # 高度数据融合优先级（见 src/evtol_siting/data/heights.py）
    height_sources: ["osm_height", "osm_levels", "raster_height", "imputed"]

  ground:
    enabled: true
    max_slope_deg: 15.0     # 地面坡度阈值 slope <= 15°
    min_parcel_area_m2: 1600.0
    # 建筑基底覆盖率上限：超过此值视为已建成区，无可用空地。
    # 申报书的判据（排除山水/生态红线/坡度）在成都平原几乎不排除任何单元，
    # 会得到 ~2300 个候选；该判据把"已建满的老城区"排除掉，是本研究
    # 相对申报书的补充。阈值需做敏感性分析（0.4–0.7）。
    max_building_coverage: 0.55
    # 排除用地类型（OSM landuse/natural 标签）
    exclude_landuse: ["water", "reservoir", "riverbank", "wetland", "marsh",
                      "wood", "forest", "scrub", "grassland", "farmland",
                      "orchard", "vineyard", "quarry", "landfill"]
    exclude_natural: ["water", "wetland", "wood", "scrub", "peak", "cliff",
                      "ridge", "bare_rock", "sand", "beach"]

  # 空域与安全约束
  safety:
    # 与机场净空区的最小距离。**作用范围**由下方 airport_exclusion_mode 决定。
    #
    # ⚠️ 该参数经敏感性分析后被下调（8000 -> 4000），理由如下：
    # 8 km 圆柱体剔除了 3860 个候选中的 2776 个（72%），其中屋顶型被剔除
    # 81%——因为成都的高层存量偏向双流机场一侧。后果是 1008 个核心需求
    # 单元中有 535 个在接驳预算内**无任何候选可达**，这使"未服务需求"
    # 这一目标被钉死在 24208 次/日（所有解相同），整个多目标问题退化：
    # 目标不再区分解，帕累托前沿被极端解撑开，单目标基线的解也不会被支配。
    #
    # 物理上，真实的空域约束是机场障碍物限制面（OLS，一个有坡度的方向性
    # 曲面），而非各向同性的圆柱体。取 4000 m 对应"紧邻机场的进离场走廊
    # 区域"，是一个更接近实物且仍属保守的近似。
    #
    # ⚠ 作用范围（2026-09-16 明确为可配置项）：
    #
    #   all_aeroway（默认，本文采用）—— 一切非 helipad/heliport 的 aeroway
    #       要素都按运输机场处理。本提取包中民用机场（双流）没有 aerodrome
    #       标签，只以航站楼/滑行道/停机位等内部要素出现，因此该口径实际
    #       覆盖了双流及其周边。候选集 1 332。
    #   military_only —— 只排除军用机场（黄田坝、太平寺、凤凰山）。
    #       双流周边候选全部进入可行集，候选集 1 552，但"预算约束情景"等
    #       MILP 由数秒膨胀到无法在可接受时间内求解（结构性原因：1 201 个
    #       地面候选成本完全一致 → 对称性爆炸；见 RUN_STATE「零之五」）。
    #
    # 取保守口径的第二条理由："eVTOL 可否设站于民航机场"本身是尚未定论的
    # 政策问题，在安全约束上保守优于先行替政策作答。代价见论文 §6.4。
    airport_exclusion_mode: all_aeroway
    #
    # 完整的 0–12000 m 扫描结果见 outputs/tables/sensitivity.csv 与论文 §5.8.1。
    airport_exclusion_radius_m: 4000.0
    # 与既有直升机坪/机场的最小距离
    existing_heliport_exclusion_m: 1000.0
    # 距水体（起降安全冗余）
    water_buffer_m: 0.0

  # 密度稀释：候选点间最小间距
  dilution:
    min_distance_m: 500.0   # c_min = 500 m

  # 每个 500m 栅格最多保留的候选点数（避免核心区过度集中）
  max_candidates_per_grid: 3

# -----------------------------------------------------------------------------
# 阶段二：K-means 人群分类
# -----------------------------------------------------------------------------
stage2_demand:
  n_clusters: 5             # K 类人群
  features:
    - "income"              # 月收入代理变量（Meta RWI / 夜间灯光 / 统计年鉴）
    - "poi_density"         # POI 密度
  standardize: true         # z-score 标准化后再聚类
  k_selection:
    method: "silhouette"    # 轮廓系数择优；可选 elbow / silhouette / fixed
    # 下界取 3 而非 2：轮廓系数在小 K 处系统性偏高，k_range 含 2 时
    # 自动选择几乎必然退化为二分，失去"人群分层"的意义。
    k_range: [3, 8]
  poi_categories:           # 参与 POI 密度计算的 OSM 标签
    - "amenity"
    - "shop"
    - "office"
    - "leisure"
    - "tourism"
  # 各类人群的 eVTOL 出行生成率（次/人/日），用于需求加权
  # 默认值来自 UAM 需求文献量级，需在敏感性分析中检验
  trip_rate_by_cluster: "auto"   # auto = 按收入单调递增；或显式给出长度 K 的列表
  # 最高收入类 / 最低收入类的出行率之比。**仅供外生阶梯使用**——行为模型开启时
  # （choice_model.enabled: true，默认）出行率由 Logit 导出，本键被忽略。
  # §5.9.2 的证伪检验扫描此键（1/2/3/5/8/10），同时关闭行为模型。
  # 之所以用"比值"而非显式列表：列表长度必须等于 K，会迫使调用方事先钉死 K，
  # 使控制臂与主分析的聚类不一致。
  trip_rate_ratio: 5.0

  # 需求强度：栅格需求 = 人口 × 该类人群出行率
  demand_unit: "trips_per_day"

  # 人口栅格不可得时的备选：由建筑体量估计人口
  #   pop = Σ(建筑基底面积 × 层数 × 居住权重) / 人均住房建筑面积
  # 40 m²/人 对应成都市城镇人均住房建筑面积的量级（成都市统计年鉴）。
  # ⚠️ 论文必须报告该标定值、该值下的隐含总人口，并与七普对应区县对比。
  area_per_person_m2: 40.0
  storey_height_m: 3.3

  # 人口重分配（dasymetric mapping）
  # 把人口从 100 m 栅格按**建筑体积**摊到 500 m 需求格网，而不是假设
  # 人口在格网内均匀分布。见 data/dasymetric.py。
  dasymetric_population: true
  # 人口来源与量级。**主结果用默认值**；两键供 §5.8 的人口参量扫描使用。
  #   population_source: worldpop（默认）| building_volume
  #     building_volume 忽略 WorldPop 栅格、改由建筑体量估计人口。它是一条
  #     **独立于人口栅格**的路径，但同时与屋顶型候选共享同一份 OSM 建筑图层
  #     （循环依赖，见 §3.5），故只作敏感性对照，不作主结果。
  #   population_scale: 乘性缩放（默认 1.0），检验需求量级的影响。
  population_source: "worldpop"
  population_scale: 1.0
  # 是否按建筑类型折算居住权重（住宅 1.0、办公 0.5、工业 0.15）。
  # 默认关闭：OSM 在成都的建筑类型标注有限，权重本身会引入不确定性。
  # 论文中应报告开启/关闭两种设定的对比。
  dasymetric_use_weights: false

# -----------------------------------------------------------------------------
# 需求生成：离散选择模型（eVTOL 采用概率）
# -----------------------------------------------------------------------------
# 用二元 Logit 从效用最大化**推导**各收入群体的 eVTOL 采用概率，取代
# "出行率随收入单调递增"这一外生假设。详见 src/evtol_siting/choice_model.py。
#
#   需求_i = 人口_i × 长距离出行率 × P(选择 eVTOL | 收入组 k(i))
#   P = 1 / (1 + exp((GC_evtol - GC_ground) / μ))
#   GC = 票价 + 时间价值 × 耗时
#
# 这样可达性不平等来自**行为**而非研究者的设定，同时补上了文献中
# "UAM 选址缺乏行为需求基础"的空白。票价成为可调的政策杠杆。
choice_model:
  enabled: true

  # --- 收入阶梯标定 ---
  # 中位数取**本城**城镇居民人均可支配收入的官方统计值（统计公报），不再用
  # "量级估计"。研究可得的是经济活动指数而非收入，需把聚类排名映射到收入阶梯，
  # 阶梯的**水平**由上式的城市真实值锚定。
  #   成都：《2020 年成都市国民经济和社会发展统计公报》
  #         城镇居民人均可支配收入 48 593 元/年 = 4 049 元/月
  income_median_cny: 4049.0
  income_sigma: 0.60

  # --- 时间价值：VOT = 工资率 × β ---
  vot_share: 0.50              # 通勤时间价值占工资率的比例（文献常用 0.4–0.6）
  working_days_per_month: 21.75
  working_hours_per_day: 8.0

  # --- 票价（元）---
  evtol_fare_fixed_cny: 40.0   # 起降与场站使用费
  evtol_fare_per_km_cny: 6.0   # 早期商业运营量级
  ground_fare_fixed_cny: 10.0
  ground_fare_per_km_cny: 2.3
  evtol_fare_multiplier: 1.0   # 政策杠杆：整体票价倍数（情景分析用）

  # --- 代表性出行 ---
  trip_distance_km: 15.0       # 代表性出行距离（dist 未启用时使用）
  # 出行距离分布：把"固定单点的代表性出行"换成**距离分布上的期望采用概率**。
  # UAM 的竞争力高度依赖距离——短途被接驳+候机开销压垮、长途被票价压垮，
  # 单点距离无法表达这一点。enabled: false 时行为与既有结果完全一致。
  trip_distance_dist:
    enabled: false             # true = 按分布积分
    median_km: 8.0             # 对数正态中位数（城市长距离出行量级）
    sigma: 0.7
    range_km: [3.0, 60.0]
    n_nodes: 24                # 等概率分位节点数
  ground_detour_factor: 1.35
  ground_speed_kmh: 22.0       # 含拥堵的城市平均行程速度
  evtol_cruise_kmh: 200.0
  evtol_access_min: 10.0
  evtol_egress_min: 4.0
  evtol_wait_min: 6.0

  # --- Logit 尺度（元）---
  # 反映未观测效用差异。25 元意味着约 27 元广义费用差对应 3:1 的选择优势。
  logit_scale_cny: 25.0

  # --- 出行生成 ---
  long_trip_rate_per_day: 0.10 # 每人每日长距离出行次数

  # --- 区域内收入异质性 ---
  # 选择模型是个体决策，而聚类给的是区域均值。用区域均值直接代入等价于
  # 假设区域内人人收入相同，会系统性低估采用率并压平收入群体差异——
  # UAM 的实际客群是各区域收入分布的**右尾**。故在区域收入分布上积分。
  integrate_within_area: true
  within_area_income_sigma: 0.40   # 区域内部收入差异（中国城市约 0.3–0.5）
  n_income_quadrature: 24

# -----------------------------------------------------------------------------
# 阶段三：0-1 整数规划选址（集合覆盖型）
# -----------------------------------------------------------------------------
stage3_ip:
  # ⚠ access_radius_m **在主路径上不生效**，仅当下面的时间预算缺省时才作为
  #   回退（见 pipeline.compute_access_time 与 RUN_STATE「零之六」）。接驳时间
  #   矩阵实际由 access.modes 各自的距离上限决定，可达性完全不经过本参数。
  #   原敏感性扫描（2000–5000 m）因此逐列结果完全相同，已删除。
  access_radius_m: 3000.0   # 仅作时间预算缺省时的回退
  # 接驳时间预算（**这才是接驳标准真正起作用的量**）。
  #
  # ⚠ 其上限由方式本身决定：短驳车 25 km/h、上限 5000 m、含 3 min 候车
  #   ⇒ 可达单元的最大接驳时间恰为 15.00 min。故本预算取 15 时**恰好饱和、
  #   是非约束的**——放宽到 20/25 不会有任何变化；只有降到 15 以下才咬合。
  #   敏感性扫描据此设计为 8/10/12/15/18，其中 18 用于证明 15 以上无变化。
  #
  # 有效服务半径因而是 5000 m（短驳车上限），不是上面的 3000 m。
  access_time_budget_min: 15.0
  # 最小核心需求量。语义按数值大小自动判别（见 stage3_ip.core_demand_mask）：
  #   0–1 之间 —— 分位数。0.6 表示"需求量最高的 40% 单元必须被覆盖"。
  #   >= 1     —— 绝对量（次/日）。
  # 推荐用分位数：绝对阈值与出行生成率标定强耦合，标定一变就会让核心
  # 单元变成空集（覆盖约束静默失效）或全集（失去优先级区分）。
  min_core_demand: 0.60
  max_sites: 40             # 起降场总数上限 N
  # 日运营小时数。**必需**：需求量的单位是"次/日"，而起降场容量
  # （candidates.capacity）的单位是"架次/小时"，两者必须换算到同一时间
  # 尺度才能施加容量约束。缺少该换算会让 load > cap 恒成立，
  # 使模型把每个候选都判为不可选、整个问题不可行。
  capacity_hours_per_day: 14.0
  # ---------------------------------------------------------------------
  # 四约束情景方案族（见 src/evtol_siting/scenarios.py）
  # 每个情景由一个**规划约束**定义，对应一个真实的规划问题。
  scenario_params:
    budget_cny: 500_000_000.0   # S1 预算上限（5 亿元）
    radius_min: 10.0            # S2 更严格的接驳时间标准（分钟）
    n_max: 15                   # S3 规划批准的站点数上限
    alpha: 0.95                 # S4 每类人群的最低覆盖率

  # ---------------------------------------------------------------------
  # 固定规模方案族
  # ---------------------------------------------------------------------
  # 与上面的集合覆盖（设施数浮动）是**两种不同的规划问题**：
  #   浮动 N 回答"最少要建几个站才能达到覆盖要求"；实测成都 4 km 机场
  #          缓冲下 11 个站即可覆盖 97.1% 的需求。
  #   固定 N 回答"既然规划了 N 个站，它们应该摆在哪里"。
  # 固定 N 下换不同目标（成本最低／距离最近／覆盖最大／体验最均衡）
  # 会得到不同的布局方案，构成方案族。见 src/evtol_siting/schemes.py。
  # ⚠ N 取本城 IP 成本优先解的站数，**该解随口径变化**：
  #   收入用 4500 量级估计时是 11 站；改用真实的 4 049 元/月后是 10 站。
  #   改收入后必须同步改这里，否则方案族与 IP 情景不可比。
  fixed_n: 10
  # 固定规模方案族中 p-中位型目标（距离最近/体验最均衡）的邻域宽度。
  # 必须显著大于基线的 25：固定 N 时全局只选少数站，邻域太窄会让
  # 求解器优化"可分配性"而非目标本身（实测 k=25 时"距离最近"方案
  # 在成本与总时间上双双劣于"最低成本"方案）。
  fixed_n_k_nearest: 120
  # "最均衡体验"分支专用的邻域宽度。必须显著更大：该分支对"每组必须服务的
  # 需求份额"施加硬约束，邻域太窄会让大量单元无法分配、模型不可行。
  fixed_n_worstcase_k_nearest: 300
  # "最均衡体验"方案中每组必须服务的最低需求份额。必须 < 1：若要求 100%，
  # 组均值的分母不确定性消失，但也让模型在邻域受限时不可行。0.95 既保证
  # 组均值可比，又留出余量。
  fixed_n_min_group_service: 0.85
  # 方案族生成的目标（顺序即输出顺序）
  scheme_objectives:
    - "min_cost"          # 成本最低
    - "min_total_time"    # 距离最近（总接驳时间最小）
    - "max_coverage"      # 覆盖最大
    - "min_worst_case"    # 体验最均衡（最差人群接驳最小）

  # 生成"两个最优方案"的方式：对 max_sites 做两点扫描
  scenarios:
    - name: "cost_priority"
      max_sites: 20
      access_radius_m: 3000.0
    - name: "coverage_priority"
      max_sites: 35
      access_radius_m: 2000.0

# -----------------------------------------------------------------------------
# 阶段四：NSGA-II 多目标优化
# -----------------------------------------------------------------------------
stage4_nsga2:
  pop_size: 200
  n_gen: 300
  # 编码：binary = 对候选集做 0/1 掩码（推荐，|M| 维）；
  #       integer = 变长整数编码（起降场编号，与申报书表述一致，作为对照）
  encoding: "binary"
  crossover_prob: 0.9
  mutation_prob: "auto"     # auto = 1/|M|
  eta_c: 20.0               # SBX 分布指数
  eta_m: 20.0               # 多项式变异分布指数
  n_offspring: null         # null = pop_size
  # 可行性修复：对不满足覆盖约束的个体执行贪心修补（解码器，只加点）
  repair: true
  # 局部搜索：对**部分子代**执行冗余站点剪枝。
  # 为什么按概率而不是无条件执行——见 stage4_nsga2.make_pruner 的说明：
  # 无条件剪枝会把稠密解瞬间剪回最小覆盖集，使高站点数区段无法被探索；
  # 而修复算子只加点又会把搜索锁在稀疏区。两者必须分开并按概率配合。
  local_search: true
  local_search_prob: 0.15
  # 初始种群的站点数区间（对数均匀）。必须覆盖合理全域，否则搜索被
  # 初始种群限制在一个窄区段内（自由规模模式下生效）。
  init_site_range: [12, 400]

  objectives:
    # 四个目标（与申报书一致），minimize = 是否转为最小化
    - key: "unserved_demand"
      name_en: "Unserved demand"
      name_zh: "未服务需求"
      minimize: true
    - key: "total_access_time"
      name_en: "Total access time"
      name_zh: "总接驳时间"
      minimize: true
    - key: "inequity"
      name_en: "Accessibility inequity (max group mean)"
      name_zh: "最差体验（人群间可达性最大差距）"
      minimize: true
    - key: "total_cost"
      name_en: "Total construction cost"
      name_zh: "总建设成本"
      minimize: true

# -----------------------------------------------------------------------------
# 成本参数（用于"总成本"目标）
# -----------------------------------------------------------------------------
costs:
  currency: "CNY"
  # 单个 FATO 的小时吞吐（架次/小时）。按 2–2.5 分钟的起降循环计。
  # 该值直接决定起降场容量，进而影响容量约束的松紧；需在敏感性分析中检验。
  fato_throughput_per_hour: 25.0
  # 屋顶型 vertiport：无需征地，但需结构加固与升降机改造
  rooftop:
    fixed: 12_000_000.0      # 元/处
    per_m2: 8_000.0          # 元/m² 建筑面积
  # 地面型 vertiport：需征地与土建
  ground:
    fixed: 25_000_000.0      # 元/处
    # 起降场实际占地（FATO + 停机位 + 航站 + 围界），用于征地与土建计费。
    # 注意不是整个 500m 栅格的面积——栅格只是"候选地块所在单元"。
    site_area_m2: 4_000.0
    land_per_m2: 3_000.0     # 元/m² 征地
    per_m2: 5_000.0          # 元/m² 建设
  # 运维（用于敏感性分析，不计入主目标）
  annual_opex_ratio: 0.05

# -----------------------------------------------------------------------------
# 接驳（access）模型
# -----------------------------------------------------------------------------
access:
  # 接驳时间的计算口径
  #   euclidean —— 直线距离 / 方式速度。快（秒级）。
  #   network   —— 基于 OSM 路网的最短路。慢（分钟级），但对被河流、
  #                铁路、封闭园区分割的城市更真实。高影响因子期刊
  #                （CEUS、TR 系列）的审稿人通常要求这一口径。
  # 论文建议：两种口径都跑，作为**稳健性检验**。结论一致本身即是有力证据。
  time_basis: "euclidean"
  # 路网口径参数
  network_cutoff_m: 6000.0   # 最短路搜索截断半径（性能关键）
  network_snap_m: 1200.0     # 点到路网的最大吸附距离

  # 多方式接驳：步行 + 短驳车 + 地铁接驳
  modes:
    - name: "walk"
      speed_kmh: 4.8
      max_distance_m: 1500.0
    - name: "shuttle"
      speed_kmh: 25.0
      max_distance_m: 5000.0
      fixed_wait_min: 3.0    # 平均候车时间
  # 接驳时间为各方式中的最小值（用户选择最快方式）
  choice_rule: "min_time"

# -----------------------------------------------------------------------------
# 评估与基线对比
# -----------------------------------------------------------------------------
evaluation:
  baselines:
    - "p_median"            # 效率单目标
    - "p_center"            # 公平(极小极大)单目标
    - "max_coverage"        # 覆盖单目标 (MCLP)
    - "set_covering"        # 成本单目标（= 阶段三 IP）
  # 帕累托前沿质量指标
  metrics: ["hypervolume", "spacing", "spread", "igd"]
  reference_front: "auto"   # auto = 合并所有算法解集后的非支配前沿
  n_runs: 10                # 独立重复次数（随机算法需报告均值±标准差）
  # p-中位模型的近邻截断数。完整模型需 n_dem × n_cand ≈ 520 万个 0-1
  # 变量，CBC 无法求解；截断到每个需求点的 k 近邻后降到约 7.6 万，
  # 可精确求解。k 足够大时不改变最优解，论文中应报告取值并做稳健性检验。
  # 0 = **不截断**，用完整的可达集（推荐）。接驳时间预算已把每个
  # 需求单元的可达候选天然限制住（成都中位 127 个），再叠一个
  # k=25 会截掉 78% 的可达配对，使模型系统性低估可服务性——
  # 实测表现为真值 99.8% 的解被算成 32%。
  # 设为正整数可回退到旧的截断行为（不推荐）。
  p_median_k_nearest: 0
  # p-中位阶段二（锚定服务量下最小化总时间）的求解参数。
  # 阶段二的规模达十几万至几十万个分配变量，小 p 时最难（锚定服务量占比越高、
  # 可行域越紧）。给一个比通用基线更宽的时限，并设一个相对间隙：CBC 达到间隙
  # 即停，此时返回的解**带最优性证书**（与界的相对差 ≤ 该值），比耗满时限后
  # 交出一个无证书的"最好解"更可辩护。论文应报告该间隙。
  # gap_rel 留空 = 求解到证明最优为止。
  p_median_time_limit_s: 3600
  p_median_gap_rel: 0.001     # 0.1%
  # 基线求解的并发数。单个 p-中位模型有 32 万个变量，6 个并发实测把内存吃光、
  # 进程被系统杀掉（2026-09-18 21:36）。3 个并发是内存与墙钟的折中。
  # 结果按算例增量落盘，即使中断也只损失正在解的那几个，下次自动续算。
  baselines_max_workers: 3

# -----------------------------------------------------------------------------
# 数据源与路径
# -----------------------------------------------------------------------------
data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  # OSM Overpass 分块下载
  #
  # ⚠️ 镜像列表必须只包含**本机实测可达**的端点。
  # 2026-09 实测（中国大陆网络）：
  #   overpass-api.de        可达，但**强限流**——连续请求会在第 2 个之后
  #                          返回 504。因此 sleep_between_s 必须够大。
  #   overpass.kumi.systems  不可达（连接超时）
  #   overpass.private.coffee 不可达
  # 把不可达的端点留在列表里代价很高：每次重试都会在它上面耗尽一整个
  # request_timeout_s，实测会导致 10 分钟只下到 2 个瓦片。
  # 若所在地网络环境不同（如在境外），可把其它镜像加回来。
  overpass:
    endpoints:
      - "https://overpass-api.de/api/interpreter"
    user_agent: "eVTOL-siting-research/0.1 (academic; contact: 2332496853@qq.com)"
    tile_size_deg: 0.02     # 瓦片边长（度），约 2.2km；504 时自动二分
    request_timeout_s: 90   # 失败要快速失败，不要长时间占着不放手
    sleep_between_s: 8.0    # 基础间隔；遇 504 限流时另加 30s×(尝试次数) 冷却
    max_retries: 3
  # OSM 数据获取通道
  #   pbf（默认，强烈推荐）—— 一次下载省级提取包后本地解析。
  #                          实测：四川省包 116 MB / 18 秒下载 / 41 秒解析。
  #   overpass             —— 按瓦片调用 Overpass API。在受限网络下会被强
  #                          限流（首个请求 200、后续全部 504），成都研究区
  #                          300 个瓦片需 8 小时以上，实际不可用。
  osm_backend: "pbf"
  pbf_province: "sichuan"   # OSM.fr 提取包的省份标识
  pbf_source: "osmfr"       # osmfr（省级，116 MB）| geofabrik（全国，1.59 GB）
  pbf_file: null            # 指定本地 PBF 路径；null = 自动下载到 data/raw/osm_pbf/

  sources:
    buildings: "osm"        # osm | local_file
    building_height_raster: "cnbh10m"  # cnbh10m | globalbuildingatlas | none
                            # CNBH-10m (Zenodo 7923866)：中国 10m 建筑高度，
                            # 是高度融合第 3 级的数据来源。成都需 2 个瓦片，
                            # 共约 123 MB。**实测成都 OSM 的 height 标签覆盖
                            # 率仅 1.1%、building:levels 仅 7.9%，因此该栅格
                            # 对候选集质量是决定性的**，不建议关闭。
    population: "worldpop"  # worldpop | local_file | synthetic
    income: "viirs"         # poi_index | viirs | local_file | synthetic
                            # ⚠️ Meta RWI **不含中国**，不可使用（详见
                            #    data/rasters.py::fetch_income 的说明）。
    poi: "osm"
    roads: "osm"
    dem: "copernicus"       # copernicus | srtm | local_file | flat
    landuse: "osm"
  # 自备收入/房价数据路径（data.sources.income="local_file" 时使用）
  # 例：成都市统计年鉴的分街道人均可支配收入，或小区房价点位数据
  local_income_file: null
  # 无网络时使用合成数据，保证流程可端到端跑通（不用于论文实证结果）
  allow_synthetic_fallback: true

# -----------------------------------------------------------------------------
# 输出
# -----------------------------------------------------------------------------
output:
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"
  data_dir: "outputs/data"
  figure_dpi: 600           # 期刊要求 ≥300 dpi，线条图建议 600
  figure_format: ["png", "pdf", "svg"]
  font_family: "DejaVu Sans"  # 出版级字体；中文图件用 "SimHei"/"Microsoft YaHei"
  language: "en"            # 论文图件语言 en | zh
